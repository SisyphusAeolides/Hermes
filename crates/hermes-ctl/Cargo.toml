[package]
name = "hermes-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hermes GSP control and host prerequisite inspection"
authors.workspace = true
repository.workspace = true
default-run = "hermes-ctl"

[[bin]]
name = "hermes-ctl"
path = "src/main.rs"

[[bin]]
name = "nvidia-smi"
path = "src/smi_main.rs"

[[bin]]
name = "nvidia-modprobe"
path = "src/modprobe_main.rs"

[[bin]]
name = "nvidia-persistenced"
path = "src/persistenced_main.rs"

[[bin]]
name = "nvidia-cuda-mps-control"
path = "src/mps_main.rs"

[[bin]]
name = "nvidia-debugdump"
path = "src/debugdump_main.rs"

[dependencies]
hermes-core = { workspace = true }
hermes-gsp = { workspace = true }
hermes-linux = { workspace = true }
hermes-nouveau = { workspace = true }
hermes-cccl = { workspace = true }
hermes-cuda = { workspace = true }
hermes-drm = { workspace = true }
hermes-mesa = { workspace = true }
hermes-nvml = { path = "../hermes-nvml" }
